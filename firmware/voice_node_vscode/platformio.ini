[platformio]
default_envs = esp32-s3-n16r8
src_dir = main

[env:esp32-s3-n16r8]
; 6.9.0 uses ESP-IDF 5.3.1, matching Espressif's current ESP-Skainet example.
; Newer 7.x packages pull a much larger unified toolchain on Windows.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
extra_scripts = post:scripts/esp_sr_model.py
build_type = release
