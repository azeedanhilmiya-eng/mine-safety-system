; ============================================================
;  矿山安全监测 - 井下离线语音关键词识别
;  ESP32-S3 N16R8 (16MB flash + 8MB Octal PSRAM) + INMP441
;  中文命令词: 救命 / 撤离   (乐鑫 MultiNet6 中文模型 mn6_cn, 零训练)
;
;  注意: 必须用 pioarduino 的 Arduino 3.x 内核。
;  PlatformIO 官方 espressif32 平台目前仍是 Arduino 2.0.17,
;  那个版本没有 ESP_SR / ESP_I2S 库, 编译会失败。
; ============================================================
[env:esp32-s3-devkitc-1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8: 16MB flash + 8MB 八线(OPI) PSRAM ----
; board 默认是 DevKitC-1-N8 (8MB/无 PSRAM), 下面三行才是真的切到 N16R8。
; memory_type = <flash>_<psram> = qio(四线flash) + opi(八线PSRAM)
; 它会去链接 .../framework-arduinoespressif32-libs/esp32s3/qio_opi/ 这套预编译库,
; 那套库的 sdkconfig 里已经开了 CONFIG_ESPTOOLPY_FLASHSIZE_16MB 和 CONFIG_SPIRAM_MODE_OCT。
; 实测(2026-09-21 qio_opi): 串口打印 "[KWS] PSRAM 正常: 8388608 bytes", PSRAM 可用。
; 之前"两种都检测不到 PSRAM"的结论已作废, 不要再按无 PSRAM 排查。
board_build.flash_size            = 16MB
board_build.flash_mode            = qio
board_build.arduino.memory_type   = qio_opi

; 让 bootloader / esptool 也知道是 16MB (否则镜像头里写 8MB,
; 而 model 分区在 0xC10000 = 12.6MB, 超出了 8MB)
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

; ---- 带 'model' 分区的分区表 (ESP_SR 必须) ----
; 唯一文件名可避免与框架自带 esp_sr_16.csv 冲突。
board_build.partitions = partitions_esp_sr_16_custom.csv

monitor_speed  = 115200
upload_speed   = 921600

; 编译时嵌入 Web，烧录固件后自动把中文模型包写入 model 分区
extra_scripts =
    pre:tools/embed_web.py
    post:tools/flash_srmodels.py

build_flags =
    ; 3=只保留 E/W/I，屏蔽 ESP-SR 每 5.8 秒一条的 "Time out" D 级日志；需要深挖时再改回 4。
    -DCORE_DEBUG_LEVEL=3
    ; 自定义分区表与 Arduino 的 esp_sr_16 布局兼容。
    -DARDUINO_PARTITION_esp_sr_16

lib_deps =
    knolleary/PubSubClient@^2.8
    sandeepmistry/LoRa@^0.8.0
