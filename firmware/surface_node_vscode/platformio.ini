

; ============================================================
;  矿安智联 - 地面网关 (Surface Gateway)
;  ESP32-S3 N16R8 + Ra-02(SX1278 433MHz) + OLED (SSD1306/SH1106)
;
;  只做单向接收: 收井下节点报文 -> 解析 -> 本地 OLED 显示 -> WiFi 上报 Firebase
;  板子/平台与井下节点 esp32s3-kws 完全一致, 可直接复用已下载的工具链。
; ============================================================
[env:esp32-s3-devkitc-1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8: 16MB flash + 8MB 八线(OPI) PSRAM ----
; 与井下节点保持同款配置; 用 qio_opi 可复用已下载的预编译库, 不必再下载一套。
board_build.flash_size          = 16MB
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; 固件含 WiFi + TLS + 中文字库, 体积超过默认 1.3MB 的 app 分区,
; 因此用 3MB app 的分区表 (等价于 Arduino IDE 的 "Huge APP")。
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.30

build_flags =
    ; 3=只保留 E/W/I 级日志, 屏蔽 WiFi 驱动的刷屏输出
    -DCORE_DEBUG_LEVEL=3
