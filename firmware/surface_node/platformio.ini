; ============================================================
;  智安矿联 · 地面网关（SML-Gateway）
;  ESP32-S3 N16R8 + Ra-02(SX1278 433MHz) + SH1106 OLED + 蜂鸣器
;
;  功能：收 LoRa 报文（VOICE / TXT / STATUS）→ 中文显示 + 声光报警 + 短信 + 上云
;
;  烧录：  pio run -t upload
;  看日志：pio device monitor        （115200）
;
;  与节点1/节点2 的射频参数必须一致：
;    433 MHz / 同步字 0xA3 / SF7 / BW125 / CR4-5 / CRC 开 / 前导 8
; ============================================================
[env:esp32-s3-devkitc-1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; 网关板是 N16R8（16MB flash）。网关不需要 PSRAM，这里保持默认不开，
; 避免 PSRAM 类型（OPI/QSPI）与实际板子不符导致启动异常。
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB

; 固件较大（WiFi + HTTP + U8g2 中文点阵字库），用 3MB APP 分区
board_build.partitions = huge_app.csv

monitor_speed = 115200
; 921600 在部分 USB 串口芯片上写大文件会掉线，统一用 460800
upload_speed  = 460800

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.30
